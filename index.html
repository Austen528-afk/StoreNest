<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10171d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StoreNest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="description" content="StoreNest brings small businesses and customers together through shareable online storefronts.">
<title>StoreNest — Your business. Your storefront.</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{height:100vh;height:100dvh;background:#10171d;color:#eff4f7}
a{color:inherit}
.wrap{width:min(1080px,calc(100% - 40px));height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}
.top{flex:0 0 clamp(55px,10dvh,84px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff19}
.logo{font-weight:900;letter-spacing:-.08em;font-size:clamp(21px,2.6vw,27px)}
.logo span{color:#60d6bd}
.label{padding:8px 13px;border:1px solid #ffffff36;border-radius:100px;color:#a4b8c4;font-size:11px;font-weight:700;letter-spacing:.04em}
main{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(8px,2dvh,20px);padding:clamp(10px,2dvh,22px) 0}
.hero{min-height:0;max-width:820px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden}
h1{font-size:clamp(28px,min(6.5vw,10dvh),88px);line-height:1.04;letter-spacing:-.065em;margin:clamp(8px,2dvh,21px) 0}
h1 em{font-style:normal;color:#60d6bd}
p{color:#afbdc9;line-height:1.5;font-size:clamp(12px,min(1.7vw,2.5dvh),19px);max-width:630px;margin:0}
.pill{color:#60d6bd;font-size:clamp(10px,1vw,12px);font-weight:800;text-transform:uppercase;letter-spacing:.14em}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.5vw,17px);margin:0}
.card{background:#1a252c;border:1px solid #ffffff18;padding:clamp(11px,2vw,24px);border-radius:16px;min-width:0}
.card .emoji{font-size:clamp(19px,2.2vw,27px)}
.card h2{font-size:clamp(13px,1.5vw,18px);margin:clamp(8px,1.2dvh,16px) 0 7px}
.card p{font-size:clamp(11px,1vw,14px);line-height:1.4;color:#adbfca}
.footer{flex:0 0 clamp(36px,7dvh,55px);border-top:1px solid #ffffff20;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:clamp(10px,.9vw,12px);color:#879da9}
@media(max-width:690px){
  .wrap{width:calc(100% - 24px)}
  .top{flex-basis:54px}
  .label{font-size:9px;padding:7px 9px}
  main{gap:8px;padding:10px 0}
  .hero{justify-content:center}
  h1{font-size:clamp(28px,min(8.5vw,7.8dvh),43px);margin:9px 0 11px}
  .hero p{font-size:clamp(11px,2.7vw,13px);line-height:1.4}
  .pill{font-size:9px;letter-spacing:.09em}
  .cards{grid-template-columns:1fr;gap:6px}
  .card{display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;padding:9px 11px;border-radius:10px}
  .card .emoji{grid-column:1;grid-row:1/3;font-size:23px;align-self:center}
  .card h2{grid-column:2;grid-row:1;font-size:12px;margin:0 0 2px}
  .card p{grid-column:2;grid-row:2;font-size:10.5px;line-height:1.3}
  .footer{flex-basis:38px;font-size:9px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
}
@media(max-height:500px){
  .top{flex-basis:43px}
  main{padding:6px 0;gap:6px}
  .hero h1{font-size:clamp(25px,min(6vw,9dvh),45px);margin:5px 0}
  .hero p{font-size:11px;line-height:1.3}
  .pill{font-size:9px}
  .card{padding:6px 10px}
  .card h2{margin:2px 0}
  .card p{font-size:10px;line-height:1.2}
  .footer{flex-basis:30px;font-size:9px}
}
@media(max-width:690px) and (max-height:520px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{display:block;padding:7px}
  .card .emoji{font-size:17px}
  .card h2{font-size:10px;margin:2px 0}
  .card p{font-size:9px;line-height:1.15}
}

.install-btn{background:#60d6bd;color:#10171d;border:0;border-radius:999px;font-weight:800;padding:10px 15px;cursor:pointer;font-family:inherit;font-size:12px;display:none}.install-btn.visible{display:inline-block}.top-actions{display:flex;align-items:center;gap:10px}.install-hint{font-size:11px;color:#a4b8c4;margin-top:14px;display:none}.install-hint.visible{display:block}@media(max-width:430px){.install-btn{padding:8px 10px;font-size:10px}.top-actions{gap:5px}}

.menu-container{position:relative;flex:0 0 auto}
.menu-toggle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:46px;height:43px;padding:8px;border:1px solid #ffffff40;border-radius:12px;color:#eff4f7;background:#ffffff08;cursor:pointer}
.menu-toggle span{display:block;width:22px;height:2px;border-radius:2px;background:currentColor;transition:transform .18s ease,opacity .18s ease}
.menu-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
.menu-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu-toggle:focus-visible,.menu-register:focus-visible{outline:2px solid #60d6bd;outline-offset:3px}
.site-menu{position:absolute;z-index:20;right:0;top:calc(100% + 10px);width:min(300px,calc(100vw - 28px));padding:10px;background:#1a252c;border:1px solid #ffffff27;border-radius:14px;box-shadow:0 18px 45px #0007}
.site-menu[hidden],.menu-feedback[hidden]{display:none}
.menu-register{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 12px;text-align:left;background:#26343b;border:1px solid #ffffff18;border-radius:9px;color:#eff4f7;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.menu-register:hover{background:#30434a}
.menu-register span{color:#60d6bd;font-size:19px}
.menu-feedback{margin:10px 4px 2px;color:#adbfca;font-size:12px;line-height:1.45}
@media(max-width:430px){.menu-toggle{width:42px;height:40px}}
.empty-home{flex:1;min-height:0;display:block;padding:0}.menu-register{text-decoration:none}
.search-row{flex:0 0 auto;padding:clamp(12px,2dvh,20px) 0 0}
.search-form{width:min(720px,100%);display:flex;align-items:center;gap:10px;min-height:54px;padding:5px 6px 5px 18px;border:1px solid #ffffff32;border-radius:15px;background:#1a252c;transition:border-color .2s,box-shadow .2s}
.search-form:focus-within{border-color:#60d6bd;box-shadow:0 0 0 3px #60d6bd18}
.search-input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#eff4f7;font:inherit;font-size:15px}
.search-input::placeholder{color:#92a8b5}
.search-submit{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:0;border-radius:11px;background:#60d6bd;color:#10171d;cursor:pointer}
.search-submit:hover{background:#80e4cd}
.search-submit:focus-visible{outline:2px solid #eff4f7;outline-offset:2px}
.search-submit svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-status{color:#a4b8c4;font-size:12px;margin:8px 0 0}
.search-status[hidden]{display:none}
@media(max-width:690px){.search-row{padding-top:12px}.search-form{min-height:48px;padding:4px 4px 4px 14px;border-radius:13px}.search-input{font-size:14px}.search-submit{width:40px;height:40px;flex-basis:40px;border-radius:10px}}
@media(max-height:500px){.search-row{padding-top:6px}.search-form{min-height:42px;padding-top:2px;padding-bottom:2px}.search-submit{height:36px;width:36px;flex-basis:36px}}

.search-results{width:min(800px,100%);padding:14px 0;overflow-y:auto;max-height:calc(100dvh - 180px);scrollbar-width:thin}
.search-results[hidden]{display:none}.results-head{font-size:12px;color:#9eb3bc;margin:0 0 11px}
.result-card{display:flex;align-items:center;gap:13px;text-decoration:none;padding:14px;margin-bottom:9px;border:1px solid #ffffff22;background:#1a252c;border-radius:14px}
.result-card:hover{border-color:#60d6bd66;background:#223038}.result-avatar{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:#60d6bd24;color:#60d6bd;display:grid;place-items:center;font-weight:900;overflow:hidden}
.result-avatar img{width:100%;height:100%;object-fit:cover}
.result-content{flex:1;min-width:0}.result-content strong{display:block;font-size:14px;color:#ecf7f8}.result-content span{display:block;font-size:11px;color:#9db2bc;margin-top:5px}.result-arrow{font-size:20px;color:#60d6bd}

/* StoreNest platform default: light surfaces with mint-green actions. */
:root{color-scheme:light}
html,body{background:#f8faf9;color:#182321}
.top{border-color:#dce6e2}
.logo{color:#172421}
.menu-toggle{color:#162923;background:#fff;border-color:#d3ded9}
.site-menu{background:#fff;border-color:#dbe4df;box-shadow:0 18px 45px #0002}
.menu-register{background:#f3f7f5;color:#142822;border-color:#e0e9e4}
.menu-register:hover{background:#e6f2ed}
.search-form{background:#fff;border-color:#d5e1db;box-shadow:0 4px 20px #192e2109}
.search-input{color:#182321}.search-input::placeholder{color:#75857f}
.search-status,.results-head{color:#63736d}
.result-card{background:#fff;border-color:#e0e7e2}
.result-card:hover{background:#f2faf6}
.result-content strong{color:#192622}.result-content span{color:#6b7771}
.result-avatar{background:#e6f5ef;color:#178e77}
.install-btn,.search-submit{background:#5ed4b6;color:#10231c}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="logo">store<span>nest.</span></div><div class="top-actions"><button class="install-btn" id="installBtn" type="button">Install app</button><div class="menu-container" id="menuContainer"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="siteMenu"><span></span><span></span><span></span></button><nav class="site-menu" id="siteMenu" aria-label="StoreNest menu" hidden><a class="menu-register" href="/business-owner.html">Register as business owner <span aria-hidden="true">→</span></a></nav></div></div></header>
<section class="search-row" role="search" aria-label="Search StoreNest">
  <form class="search-form" id="storeSearchForm">
    <input class="search-input" id="storeSearchInput" type="search" name="q" placeholder="Search stores, products or services" aria-label="Search stores, products or services" autocomplete="off">
    <button class="search-submit" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button>
  </form>
  <p class="search-status" id="storeSearchStatus" role="status" hidden></p>
</section>
<main class="empty-home" aria-label="StoreNest home"><section id="searchResults" class="search-results" aria-live="polite" hidden></section></main>
</div><script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(()=>{})})}
let installPrompt=null;const installBtn=document.getElementById("installBtn");const installHint=document.getElementById("installHint");
function showHint(message){if(installHint){installHint.textContent=message;installHint.classList.add("visible")}else{window.alert(message)}}
window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;installBtn.classList.add("visible")});
installBtn.addEventListener("click",async()=>{if(!installPrompt){showHint("To install on Samsung: open this site in Samsung Internet or Chrome, tap the browser menu, then choose Add page to / Add to Home screen or Install app.");return}const prompt=installPrompt;installPrompt=null;installBtn.classList.remove("visible");await prompt.prompt();const result=await prompt.userChoice;if(result.outcome!=="accepted")showHint("You can install StoreNest later from your browser menu.")});
window.addEventListener("appinstalled",()=>{installBtn.classList.remove("visible");showHint("StoreNest is installed.")});
if(/Android/i.test(navigator.userAgent)){installBtn.classList.add("visible");installBtn.textContent="Install app"}
if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.navigator.standalone){showHint("On iPhone: open Share, then choose Add to Home Screen to install StoreNest.")}

const storeSearchForm=document.getElementById("storeSearchForm");
const storeSearchInput=document.getElementById("storeSearchInput");
const storeSearchStatus=document.getElementById("storeSearchStatus");

const resultRoot=document.getElementById("searchResults");
const STORE_SEARCH={url:"https://cypbjzbagezdelmemuhb.supabase.co",key:"sb_publishable_8W8zyYtggQMWoFlnxrzoVA_BUKjQ9va"};
let searchClient=null,searchCounter=0;
function escapeResult(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function getSearchClient(){
 if(searchClient)return searchClient;
 if(!window.supabase)await new Promise((res,rej)=>{const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0";script.onload=res;script.onerror=rej;document.head.append(script)});
 searchClient=window.supabase.createClient(STORE_SEARCH.url,STORE_SEARCH.key,{auth:{persistSession:false,autoRefreshToken:false}});
 return searchClient;
}
async function findBusinesses(query){
 const seq=++searchCounter;
 if(!query){resultRoot.hidden=true;storeSearchStatus.hidden=true;return}
 resultRoot.hidden=false;resultRoot.textContent="Searching published businesses…";
 storeSearchStatus.hidden=true;
 try{
   const client=await getSearchClient();
   const {data,error}=await client.rpc("search_storenest_businesses",{search_term:query});
   if(error)throw error;if(seq!==searchCounter)return;
   const rows=data||[],esc=escapeResult;
   resultRoot.innerHTML='<p class="results-head">'+rows.length+' business'+(rows.length===1?'':'es')+' found for "'+esc(query)+'"</p>'+
     (rows.length?rows.map(b=>'<a class="result-card" href="/storefront.html?slug='+encodeURIComponent(b.slug)+'"><span class="result-avatar">'+(b.logo_url&&/^https:\/\//i.test(b.logo_url)?'<img alt="" src="'+esc(b.logo_url)+'">':esc(b.name.slice(0,1).toUpperCase()))+'</span><span class="result-content"><strong>'+esc(b.name)+'</strong><span>'+esc([b.category,b.location].filter(Boolean).join(' · '))+'</span></span><span class="result-arrow">→</span></a>').join(''):'<p class="results-head">No published businesses match this search.</p>');
 }catch(e){if(seq!==searchCounter)return;resultRoot.innerHTML='<p class="results-head">Search could not load. Please try again.</p>';console.error("Store search error",e)}
}
storeSearchForm.addEventListener("submit",event=>{event.preventDefault();findBusinesses(storeSearchInput.value.trim())});
storeSearchInput.addEventListener("input",()=>{if(!storeSearchInput.value.trim()){searchCounter++;resultRoot.hidden=true;storeSearchStatus.hidden=true}});
const menuContainer=document.getElementById("menuContainer");
const menuToggle=document.getElementById("menuToggle");
const siteMenu=document.getElementById("siteMenu");
function setMenuOpen(open){siteMenu.hidden=!open;menuToggle.setAttribute("aria-expanded",String(open));menuToggle.setAttribute("aria-label",open?"Close menu":"Open menu");}
menuToggle.addEventListener("click",()=>setMenuOpen(siteMenu.hidden));
document.addEventListener("click",event=>{if(!menuContainer.contains(event.target))setMenuOpen(false)});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!siteMenu.hidden){setMenuOpen(false);menuToggle.focus()}});
</script></body></html>
