<body>
<div class="page">
  <header class="top">
    <a class="logo" href="/" aria-label="StoreNest home">store<span>nest.</span></a>
    <nav><a class="back-link" href="/">← Explore stores</a><a class="owner-link" href="/business-owner.html#login">Business owner</a></nav>
  </header>
  <main id="main"><div class="state">Loading storefront…</div></main>
  <footer class="footer"><span>StoreNest · Your business. Your storefront.</span><span>Products displayed for browsing · Checkout not available yet</span></footer>
</div>
<div class="cart-backdrop" id="cartBackdrop" hidden>
  <aside class="cart-panel" role="dialog" aria-modal="true" aria-label="Your basket">
    <div class="cart-head"><h2>Your basket</h2><button type="button" class="close-cart" id="closeCart" aria-label="Close basket">×</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-total"><span>Subtotal</span><span id="cartTotal">R0.00</span></div>
    <button type="button" id="clearCart" class="cart-clear">Clear basket</button>
    <p class="cart-note">Basket preview only. Orders and checkout are not enabled yet.</p>
  </aside>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="galleryDialog" class="gallery-backdrop" hidden><section class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="galleryTitle"><div class="gallery-top"><div><h2 id="galleryTitle">Product</h2><p id="galleryDescription"></p></div><button id="galleryClose" class="gallery-close" type="button" aria-label="Close product photos">×</button></div><div class="gallery-stage"><button type="button" id="galleryPrev" class="gallery-nav" aria-label="Previous photo">‹</button><img id="galleryImage" alt="Product photo"><button type="button" id="galleryNext" class="gallery-nav" aria-label="Next photo">›</button></div><div class="gallery-bottom"><span id="galleryPosition"></span><div id="galleryDots" class="gallery-dots"></div><button id="galleryAdd" class="add" type="button">+ Add</button></div></section></div>
<script>
"use strict";
const CONFIG={url:"https://cypbjzbagezdelmemuhb.supabase.co",key:"sb_publishable_8W8zyYtggQMWoFlnxrzoVA_BUKjQ9va"};
const cart=new Map();
let availableItems=[],toastTimer=null,activeGalleryItem=null,galleryIndex=0,galleryReturnFocus=null;
const $=id=>document.getElementById(id);
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(name){return String(name||"SN").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"SN"}
function safeUrl(value){try{const u=new URL(value);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return""}}
function galleryPhotos(item){const imgs=Array.isArray(item?.media_urls)?item.media_urls.filter(u=>typeof u==="string"&&safeUrl(u)):[];return imgs.length?imgs:(safeUrl(item?.image_url)?[item.image_url]:[])}
function money(v){return "R"+Number(v||0).toFixed(2)}
function toast(msg){clearTimeout(toastTimer);$("toast").textContent=msg;$("toast").hidden=false;toastTimer=setTimeout(()=>{$("toast").hidden=true},1900)}
function cartQuantity(){return [...cart.values()].reduce((n,q)=>n+q,0)}
function syncCartBadge(){const count=$("bagCount");if(count)count.textContent=String(cartQuantity())}
function renderCart(){
  const rows=availableItems.filter(i=>cart.has(i.id));
  $("cartItems").innerHTML=rows.length?rows.map(i=>'<div class="cart-item"><div><strong>'+esc(i.name)+'</strong><small>'+money(i.price)+' each</small></div><div class="cart-controls"><button type="button" data-cart-action="minus" data-id="'+esc(i.id)+'" aria-label="Remove one '+esc(i.name)+'">−</button><span>'+cart.get(i.id)+'</span><button type="button" data-cart-action="plus" data-id="'+esc(i.id)+'" aria-label="Add one '+esc(i.name)+'">+</button></div></div>').join(''):'<p class="empty">Your basket is empty. Add something from the menu.</p>';
  $("cartTotal").textContent=money(rows.reduce((sum,i)=>sum+Number(i.price)*cart.get(i.id),0));
  syncCartBadge();
}
function openCart(){renderCart();$("cartBackdrop").hidden=false;$("closeCart").focus()}
function closeCart(){$("cartBackdrop").hidden=true;const trigger=$("openCart");if(trigger)trigger.focus()}
$("closeCart").addEventListener("click",closeCart);
$("cartBackdrop").addEventListener("click",e=>{if(e.target===$("cartBackdrop"))closeCart()});
$("clearCart").addEventListener("click",()=>{cart.clear();renderCart()});
$("cartItems").addEventListener("click",e=>{const b=e.target.closest("[data-cart-action]");if(!b)return;const id=b.dataset.id;const next=(cart.get(id)||0)+(b.dataset.cartAction==="plus"?1:-1);if(next<=0)cart.delete(id);else cart.set(id,next);renderCart()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("cartBackdrop").hidden)closeCart()});

function showGalleryImage(){
 const photos=galleryPhotos(activeGalleryItem);if(!photos.length)return;
 galleryIndex=Math.max(0,Math.min(galleryIndex,photos.length-1));
 $("galleryImage").src=photos[galleryIndex];$("galleryImage").alt=activeGalleryItem.name+" photo "+(galleryIndex+1);
 $("galleryPosition").textContent=(galleryIndex+1)+" / "+photos.length;
 $("galleryPrev").disabled=galleryIndex===0;$("galleryNext").disabled=galleryIndex===photos.length-1;
 $("galleryDots").replaceChildren();
 photos.forEach((_,i)=>{const dot=document.createElement("button");dot.type="button";dot.className=i===galleryIndex?"active":"";dot.setAttribute("aria-label","Show picture "+(i+1));dot.addEventListener("click",()=>{galleryIndex=i;showGalleryImage()});$("galleryDots").append(dot)});
}
function openProductGallery(id,trigger){
 const item=availableItems.find(row=>row.id===id);if(!item)return;
 activeGalleryItem=item;galleryReturnFocus=trigger;galleryIndex=0;
 $("galleryTitle").textContent=item.name;$("galleryDescription").textContent=item.description||"";
 $("galleryAdd").dataset.addItem=id;
 const photos=galleryPhotos(item);
 $("galleryImage").hidden=photos.length===0;
 if(photos.length)showGalleryImage();else{$("galleryPosition").textContent="No pictures yet";$("galleryPrev").disabled=true;$("galleryNext").disabled=true;$("galleryDots").replaceChildren()}
 $("galleryDialog").hidden=false;document.body.style.overflow="hidden";$("galleryClose").focus();
}
function closeProductGallery(){$("galleryDialog").hidden=true;document.body.style.overflow="";activeGalleryItem=null;galleryReturnFocus?.focus()}
$("galleryClose").addEventListener("click",closeProductGallery);
$("galleryPrev").addEventListener("click",()=>{galleryIndex--;showGalleryImage()});
$("galleryNext").addEventListener("click",()=>{galleryIndex++;showGalleryImage()});
$("galleryDialog").addEventListener("click",event=>{if(event.target===$("galleryDialog"))closeProductGallery()});
$("galleryAdd").addEventListener("click",()=>{const id=activeGalleryItem?.id;if(id){cart.set(id,(cart.get(id)||0)+1);syncCartBadge();toast("Added to basket")}});
document.addEventListener("keydown",event=>{
 if($("galleryDialog").hidden)return;
 if(event.key==="Escape")closeProductGallery();
 else if(event.key==="ArrowLeft"&&!$("galleryPrev").disabled){galleryIndex--;showGalleryImage()}
 else if(event.key==="ArrowRight"&&!$("galleryNext").disabled){galleryIndex++;showGalleryImage()}
});
let swipeX=null;
$("galleryImage").addEventListener("touchstart",event=>{swipeX=event.touches[0]?.clientX??null},{passive:true});
$("galleryImage").addEventListener("touchend",event=>{if(swipeX===null)return;const delta=(event.changedTouches[0]?.clientX??swipeX)-swipeX;swipeX=null;if(Math.abs(delta)<45)return;if(delta<0&&!$("galleryNext").disabled){galleryIndex++;showGalleryImage()}else if(delta>0&&!$("galleryPrev").disabled){galleryIndex--;showGalleryImage()}},{passive:true});
$("main").addEventListener("click",e=>{
  const add=e.target.closest("[data-add-item]");
  if(add){const id=add.dataset.addItem;if(!availableItems.some(i=>i.id===id))return;cart.set(id,(cart.get(id)||0)+1);syncCartBadge();toast("Added to basket");return}
  const open=e.target.closest("[data-open-product]");if(open){openProductGallery(open.dataset.openProduct,open);return}
  if(e.target.closest("#openCart"))openCart();
});
async function load(){
 const slug=new URLSearchParams(location.search).get("slug");
 const root=$("main");
 if(!slug){root.innerHTML='<div class="notice">This storefront link is incomplete.</div>';return}
 try{
   if(!window.supabase)await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0";s.onload=resolve;s.onerror=reject;document.head.append(s)});
   const client=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:false,autoRefreshToken:false}});
   const response=await client.from("businesses").select("id,name,slug,category,description,logo_url,location,phone,email,website,is_published,storefront_config").eq("slug",slug).eq("is_published",true).maybeSingle();
   if(response.error)throw response.error;
   const business=response.data;
   if(!business){root.innerHTML='<div class="notice">This storefront is unavailable. It may be unpublished or the link may have changed.</div>';return}
   const catalog=await client.from("business_items").select("id,name,item_type,description,price,image_url,media_urls").eq("business_id",business.id).eq("is_available",true).order("display_order").order("created_at",{ascending:false});
   if(catalog.error)throw catalog.error;
   availableItems=catalog.data||[];
   // Remember genuine storefront visits for this device only.
   try{
     const key="storenest:recent-businesses:v1";
     const slugText=String(business.slug||"");
     if(/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slugText)){
       const previous=JSON.parse(localStorage.getItem(key)||"[]");
       const record={slug:slugText,name:String(business.name||"").slice(0,120),category:String(business.category||"").slice(0,100),location:String(business.location||"").slice(0,120),logo_url:/^https:\/\//i.test(business.logo_url||"")?String(business.logo_url).slice(0,1024):""};
       const next=[record,...(Array.isArray(previous)?previous:[]).filter(item=>item&&item.slug!==slugText)].slice(0,8);
       localStorage.setItem(key,JSON.stringify(next));
     }
   }catch(error){console.warn("Recent storefront history unavailable",error)}
   document.title=business.name+" — StoreNest";
   const cfg=business.storefront_config||{};
   const accent=/^#[0-9a-f]{6}$/i.test(cfg.accent||"")?cfg.accent:"#e6a15e";
   document.documentElement.style.setProperty("--accent",accent);
   const layout=["classic","showcase","compact","decor"].includes(cfg.layout)?cfg.layout:"classic";
   const decorCategory=/home\s*(?:&|and)\s*decor|decors?|furnish|interior|homeware|furniture/i.test([business.category,business.name].filter(Boolean).join(" "));
   const isDecor=layout==="decor"||(decorCategory&&layout==="classic");
   document.body.dataset.storeType=isDecor?"decor":"standard";
   if(isDecor&&(!cfg.accent||/^#60d6bd$/i.test(cfg.accent)))document.documentElement.style.setProperty("--accent","#98836a");
   const contacts=[];
   if(business.location)contacts.push('<span>⌖ '+esc(business.location)+'</span>');
   if(business.phone)contacts.push('<a href="tel:'+esc(business.phone)+'">☎ '+esc(business.phone)+'</a>');
   if(business.email)contacts.push('<a href="mailto:'+esc(business.email)+'">✉ '+esc(business.email)+'</a>');
   const website=safeUrl(business.website&&business.website.includes("://")?business.website:"https://"+business.website);
   if(business.website&&website)contacts.push('<a href="'+esc(website)+'" rel="noopener noreferrer" target="_blank">↗ Website</a>');
   const cover=safeUrl(cfg.hero);
   const logo=safeUrl(business.logo_url);
   const photos=availableItems.map(item=>{
     const media=galleryPhotos(item),first=media[0],count=media.length;
     return '<article class="card"><button type="button" class="item-open" data-open-product="'+esc(item.id)+'" aria-label="View '+esc(item.name)+' photos and details"><div class="art">'+(first?'<img src="'+esc(first)+'" alt="'+esc(item.name)+'" loading="lazy">':item.item_type==="service"?"✦":"▧")+(count>1?'<span class="photo-count">▧ '+count+' photos</span>':'')+'</div></button><div class="item-body"><h3>'+esc(item.name)+'</h3><p>'+esc(item.description||"")+'</p><div class="item-bottom"><span class="price">'+money(item.price)+'</span><button class="add" type="button" data-add-item="'+esc(item.id)+'" aria-label="Add '+esc(item.name)+' to basket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button></div></div></article>';
   }).join("");
   const standardHero=
     '<section class="hero layout-'+layout+'">'+(cover?'<img class="hero-cover" src="'+esc(cover)+'" alt="">':'')+
     '<div class="hero-top"><div class="store-identity">'+(logo?'<img class="store-logo" src="'+esc(logo)+'" alt="">':'')+
     '<span class="brand-name">'+esc(business.name)+'<span class="brand-dot">.</span></span></div>'+
     '<button type="button" id="openCart" class="bag" aria-label="Open basket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 12H4L5 8ZM9 9V6a3 3 0 0 1 6 0v3"/></svg><span id="bagCount">0</span></button></div>'+
     '<div class="hero-copy"><h1>'+esc(cfg.headline||"Welcome to "+business.name)+'</h1>'+
     (cfg.tagline?'<p class="hero-tag">'+esc(cfg.tagline)+'</p>':'')+
     '<p>'+esc(business.description||business.category||"Discover our products and services.")+'</p></div></section>';

   const decorImage=cover||galleryPhotos(availableItems.find(item=>galleryPhotos(item).length)||availableItems[0])[0]||"";
   const decorHero=
     '<section class="decor-hero"><div class="decor-copy"><div class="store-identity">'+
     (logo?'<img class="store-logo" src="'+esc(logo)+'" alt="">':'')+
     '<span class="brand-name">'+esc(business.name)+'<span class="brand-dot">.</span></span></div>'+
     '<div><span class="decor-eyebrow">HOME &amp; DECOR</span><h1>'+esc(cfg.headline||"Made for the spaces you love")+'</h1>'+
     (cfg.tagline?'<p class="decor-tag">'+esc(cfg.tagline)+'</p>':'')+
     '<p class="decor-summary">'+esc(business.description||"Explore pieces for the home and everyday spaces.")+'</p></div>'+
     '<a class="decor-cta" href="#catalog">Explore collection</a></div>'+
     '<div class="decor-visual">'+(decorImage?'<img src="'+esc(decorImage)+'" alt="Featured home decor">':'')+
     '<button type="button" id="openCart" class="bag" aria-label="Open basket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 12H4L5 8ZM9 9V6a3 3 0 0 1 6 0v3"/></svg><span id="bagCount">0</span></button></div></section>';
   root.innerHTML=(isDecor?decorHero:standardHero)+
     (cfg.welcome?'<div class="welcome">'+esc(cfg.welcome)+'</div>':'')+
     '<div class="contacts">'+contacts.join("")+'</div>'+
     '<div class="catalog-heading" id="catalog"><div>'+(isDecor?'<span class="decor-collection-eyebrow">DISCOVER MORE</span>':'')+'<h2>'+esc(isDecor?"Explore the Collection":business.category==="Food & Drink"?"Our Menu":"Products & Services")+'</h2></div><span>'+availableItems.length+' item'+(availableItems.length===1?'':'s')+'</span></div>'+
     (photos?'<section class="grid" aria-label="Available products and services">'+photos+'</section>':'<section class="empty"><strong>Catalogue coming soon</strong>This business has not added available products or services yet.</section>');
 }catch(error){root.innerHTML='<div class="notice">We couldn’t load this storefront right now. Please try again later.</div>';console.error("Storefront load error",error)}
}
load();
</script>
</body>
</html>
