<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10171d"><meta name="description" content="Browse a StoreNest business storefront."><title>Storefront — StoreNest</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10171d;color:#eff4f7}a{color:inherit}.page{width:min(980px,calc(100% - 32px));margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff19}.logo{font-size:23px;font-weight:900;letter-spacing:-.08em;text-decoration:none}.logo span{color:#60d6bd}.owner-link{font-size:11px;color:#9db0ba;text-decoration:none}.owner-link:hover{color:#60d6bd}.hero{margin-top:22px;min-height:220px;border:1px solid #ffffff1b;border-radius:16px;background:radial-gradient(ellipse at 80% 0%,#4e9e8050,transparent 40%),linear-gradient(130deg,#1b3735,#1a252a 65%);display:flex;align-items:flex-end;gap:16px;padding:24px}.avatar{width:62px;height:62px;flex:0 0 62px;border:1px solid #83e3cf55;border-radius:17px;background:#60d6bd22;color:#83e3cf;display:grid;place-items:center;font-size:20px;font-weight:900}.hero-copy{min-width:0}.eyebrow{color:#8bdccb;font-size:9px;letter-spacing:.13em;font-weight:850}.hero h1{font-size:clamp(24px,5vw,36px);letter-spacing:-.055em;margin:5px 0}.hero p{font-size:11px;line-height:1.5;color:#a7bdc0;margin:4px 0 0}.contact{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.contact a,.contact span{font-size:10px;color:#b5c7cc;text-decoration:none;border:1px solid #ffffff1c;background:#ffffff06;padding:7px 10px;border-radius:30px}.contact a:hover{border-color:#60d6bd69;color:#79dfc6}.catalog-head{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.catalog-head h2{font-size:18px;letter-spacing:-.04em;margin:0}.catalog-head span{color:#8da2ac;font-size:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{border:1px solid #ffffff17;background:#18232a;border-radius:11px;overflow:hidden}.art{height:130px;background:linear-gradient(135deg,#25383d,#1a252b);display:grid;place-items:center;color:#60d6bd80;font-size:32px}.art img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.body-top{display:flex;align-items:start;justify-content:space-between;gap:8px}.body h3{font-size:12px;margin:0}.type{font-size:8px;color:#88a5ac;border:1px solid #ffffff18;border-radius:20px;padding:3px 6px}.body p{font-size:10px;color:#9aadb5;line-height:1.45;margin:7px 0;min-height:28px}.price{font-size:13px;font-weight:850}.empty,.notice{margin:20px 0;border:1px dashed #ffffff20;border-radius:12px;padding:32px 20px;text-align:center;color:#9aadb5;font-size:11px}.empty strong{display:block;color:#e9f0f1;font-size:13px;margin-bottom:6px}.notice{border-style:solid;color:#e4b3a7}.footer{margin-top:auto;padding:22px 0 15px;border-top:1px solid #ffffff18;color:#81969f;font-size:9px;display:flex;justify-content:space-between;gap:8px}.state{padding:10px 0;color:#91a5ae;font-size:11px}@media(max-width:650px){.page{width:calc(100% - 24px)}.top{height:58px}.hero{margin-top:12px;min-height:178px;padding:15px;gap:11px}.avatar{width:49px;height:49px;flex-basis:49px;border-radius:13px;font-size:16px}.hero h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.art{height:104px}.body{padding:8px}.body h3{font-size:10px}.body p{font-size:8px}.price{font-size:11px}.catalog-head{margin-top:18px}.catalog-head h2{font-size:16px}}

.hero.has-cover{background-size:cover;background-position:center}.hero.layout-showcase{min-height:320px}.hero.layout-compact{min-height:155px}
.hero .hero-subtitle{font-weight:700;color:#e9f8f2;margin:3px 0}
.welcome-block{padding:12px 16px;border-radius:12px;background:#ffffff06;color:#c0d1d5;margin:12px 0;font-size:12px;line-height:1.6}
</style>
</head>
<body><div class="page"><header class="top"><a href="/" class="logo">store<span>nest.</span></a><a href="/business-owner.html#login" class="owner-link">Business owner? Sign in →</a></header><main id="main"><div class="state">Loading storefront…</div></main><footer class="footer"><span>StoreNest · Your business. Your storefront.</span><span>Contact the business directly to enquire</span></footer></div>
<script>
"use strict";
const CONFIG={url:"https://cypbjzbagezdelmemuhb.supabase.co",key:"sb_publishable_8W8zyYtggQMWoFlnxrzoVA_BUKjQ9va"};
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(name){return String(name||"SN").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"SN"}
async function main(){const slug=new URLSearchParams(location.search).get("slug");const root=document.getElementById("main");if(!slug){root.innerHTML='<div class="notice">This storefront link is incomplete.</div>';return}try{if(!window.supabase)await new Promise((resolve,reject)=>{const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0";script.onload=resolve;script.onerror=reject;document.head.appendChild(script)});const client=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:false,autoRefreshToken:false}});const {data:business,error}=await client.from("businesses").select("id,name,slug,category,description,logo_url,location,phone,email,website,is_published,storefront_config").eq("slug",slug).eq("is_published",true).maybeSingle();if(error)throw error;if(!business){root.innerHTML='<div class="notice">This storefront is unavailable. It may be unpublished or the link may have changed.</div>';return}const {data:items,error:itemError}=await client.from("business_items").select("id,name,item_type,description,price,image_url").eq("business_id",business.id).eq("is_available",true).order("display_order").order("created_at",{ascending:false});if(itemError)throw itemError;document.title=`${business.name} — StoreNest`;const contact=[];if(business.location)contact.push(`<span>⌖ ${esc(business.location)}</span>`);if(business.phone)contact.push(`<a href="tel:${esc(business.phone)}">☎ ${esc(business.phone)}</a>`);if(business.email)contact.push(`<a href="mailto:${esc(business.email)}">✉ ${esc(business.email)}</a>`);if(business.website)contact.push(`<a href="${/^https?:\/\//i.test(business.website)?esc(business.website):"https://"+esc(business.website)}" target="_blank" rel="noopener noreferrer">↗ Visit website</a>`);const cards=(items||[]).map(item=>`<article class="card"><div class="art">${item.image_url?`<img src="${esc(item.image_url)}" alt="${esc(item.name)}">`:item.item_type==="service"?"✦":"▧"}</div><div class="body"><div class="body-top"><h3>${esc(item.name)}</h3><span class="type">${item.item_type==="service"?"Service":"Product"}</span></div><p>${esc(item.description||"")}</p><span class="price">R${Number(item.price||0).toFixed(2)}</span></div></article>`).join("");const config=business.storefront_config||{};const accent=/^#[0-9a-f]{6}$/i.test(config.accent||"")?config.accent:"#60d6bd";const hero=/^https:\/\/[^\s"'<>]+$/i.test(config.hero||"")?config.hero:"";const layout=["classic","showcase","compact"].includes(config.layout)?config.layout:"classic";document.documentElement.style.setProperty("--store-accent",accent);const heroStyle=hero?'style="background-image:linear-gradient(#10171d70,#10171dd1),url(&quot;'+esc(hero)+'&quot;);border-color:'+accent+'55"':'style="border-color:'+accent+'33"';root.innerHTML=`<section class="hero layout-${layout} ${hero?"has-cover":""}" ${heroStyle}><div class="avatar" style="color:${accent};border-color:${accent}55">${business.logo_url?`<img src="${esc(business.logo_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:esc(initials(business.name))}</div><div class="hero-copy"><span class="eyebrow">${esc(business.category||"LOCAL BUSINESS")}</span><h1>${esc(config.headline||business.name)}</h1>${config.tagline?`<p class="hero-subtitle">${esc(config.tagline)}</p>`:""}<p>${esc(business.description||"Welcome to our StoreNest storefront.")}</p></div></section>${config.welcome?`<div class="welcome-block">${esc(config.welcome)}</div>`:""}<div class="contact">${contact.join("")}</div><div class="catalog-head"><h2>Products &amp; Services</h2><span>${(items||[]).length} available</span></div>${cards?`<section class="grid">${cards}</section>`:'<section class="empty"><strong>Catalogue coming soon</strong>This business has not added available products or services yet.</section>'}`}catch(error){root.innerHTML='<div class="notice">We couldn’t load this storefront right now. Please try again later.</div>';console.error("Storefront load error",error)}}
main();
</script></body></html>
