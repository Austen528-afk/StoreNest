name: R2 integration unit tests
on:
  push:
    branches: [feat/r2-storage-integration, feat/listing-approval-operations]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run mocked R2 and basic approval interface tests
        run: node --test tests/r2-smoke.test.cjs tests/listing-approval-mvp.test.cjs
