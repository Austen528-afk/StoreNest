name: Build StoreNest Android APK
on:
  push:
    branches: [main, feature/android-app]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-storenest-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StoreNest
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreNest-Android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-android-preview:
    name: Publish Android APK download
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: StoreNest-Android-debug-apk
          path: ./apk

      - name: Publish Android preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s ./apk/app-debug.apk
          mv ./apk/app-debug.apk ./apk/StoreNest-Android-v0.1.apk
          if gh release view android-preview-v0.1.0 >/dev/null 2>&1; then
            gh release upload android-preview-v0.1.0 ./apk/StoreNest-Android-v0.1.apk --clobber
          else
            gh release create android-preview-v0.1.0 ./apk/StoreNest-Android-v0.1.apk \
              --title "StoreNest Android preview v0.1" \
              --notes "Development APK for Samsung testing. Download and install the APK. Not a Play Store release. No live orders or payment features yet." \
              --prerelease --target "${GITHUB_SHA}"
          fi
